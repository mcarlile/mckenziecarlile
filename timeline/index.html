<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline — McKenzie Carlile</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    /* Fill viewport — override body min-height/overflow for this page */
    html, body { height: 100%; overflow: hidden; }

    body {
      display: flex;
      flex-direction: column;
      padding-bottom: 0;
    }

    nav { flex-shrink: 0; }

    /* ── Layout ── */
    .timeline-layout {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .timeline-sidebar {
      width: 300px;
      min-width: 300px;
      overflow-y: auto;
      padding: 2rem 1.75rem 2rem;
      border-right: 1px solid var(--color-border);
      scrollbar-width: none;
    }
    .timeline-sidebar::-webkit-scrollbar { display: none; }

    .timeline-sidebar-header {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-text-tertiary);
      margin-bottom: 1.75rem;
    }

    /* ── Year group ── */
    .timeline-year {
      margin-bottom: 1.75rem;
    }

    .timeline-year-label {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-text-tertiary);
      padding-bottom: 0.5rem;
      margin-bottom: 0.25rem;
      border-bottom: 1px solid var(--color-border);
    }

    /* ── Entry ── */
    .timeline-entry {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0.625rem;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.12s;
      margin: 0 -0.625rem;
      user-select: none;
    }

    .timeline-entry:hover { background: var(--color-surface); }

    .timeline-entry.active { background: var(--color-surface); }

    .timeline-entry-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--color-border);
      transition: background 0.15s, transform 0.15s;
    }

    .timeline-entry.active .timeline-entry-dot,
    .timeline-entry:hover .timeline-entry-dot {
      background: var(--color-text-primary);
      transform: scale(1.3);
    }

    .timeline-entry-name {
      font-family: var(--font-serif);
      font-size: 1.0625rem;
      color: var(--color-text-primary);
      line-height: 1.3;
    }

    /* ── Globe container ── */
    .timeline-globe-wrap {
      flex: 1;
      min-width: 0;
      position: relative;
      background: #080c14;
      overflow: hidden;
    }

    #globe-container {
      position: absolute;
      inset: 0;
    }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      html, body { height: auto; overflow: auto; }

      body { display: block; }

      .timeline-layout {
        display: block;
        overflow: visible;
      }

      .timeline-sidebar {
        width: 100%;
        min-width: 0;
        border-right: none;
        overflow: visible;
        padding: 1.5rem 0 2rem;
        height: auto;
      }

      .timeline-globe-wrap { display: none; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">McKenzie Carlile</a>
  <ul class="nav-links">
    <li><a href="/timeline/" aria-current="page">Timeline</a></li>
    <li><a href="/field-reports/">Field reports</a></li>
    <li><a href="/contact/">Contact</a></li>
  </ul>
</nav>

<div class="timeline-layout">

  <aside class="timeline-sidebar" id="sidebar">
    <div class="timeline-sidebar-header">Field notes</div>
  </aside>

  <div class="timeline-globe-wrap">
    <div id="globe-container"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.31.0/dist/globe.gl.min.js"></script>
<script>
  const NOTES = [
    { id: 0, year: 2026, label: "India",          lat: 20.5937,  lng: 78.9629  },
    { id: 1, year: 2026, label: "Australia",       lat: -25.2744, lng: 133.7751 },
    { id: 2, year: 2026, label: "Alaska",          lat: 64.2008,  lng: -153.4937 },
    { id: 3, year: 2025, label: "Jaisalmer, India",lat: 26.9157,  lng: 70.9083  },
    { id: 4, year: 2025, label: "London",          lat: 51.5074,  lng: -0.1278  },
    { id: 5, year: 2024, label: "Japan",           lat: 36.2048,  lng: 138.2529 },
    { id: 6, year: 2024, label: "Singapore",       lat: 1.3521,   lng: 103.8198 },
    { id: 7, year: 2024, label: "Vietnam",         lat: 14.0583,  lng: 108.2772 },
  ];

  // ── Build sidebar ──────────────────────────────────────────────────────────
  const sidebar = document.getElementById('sidebar');
  const header  = sidebar.querySelector('.timeline-sidebar-header');
  const years   = [...new Set(NOTES.map(n => n.year))];

  years.forEach(year => {
    const group = document.createElement('div');
    group.className = 'timeline-year';

    const yearLabel = document.createElement('div');
    yearLabel.className = 'timeline-year-label';
    yearLabel.textContent = year;
    group.appendChild(yearLabel);

    NOTES.filter(n => n.year === year).forEach(note => {
      const el = document.createElement('div');
      el.className = 'timeline-entry';
      el.dataset.id = note.id;
      el.innerHTML = `<div class="timeline-entry-dot"></div><span class="timeline-entry-name">${note.label}</span>`;
      el.addEventListener('click', () => activate(note.id));
      group.appendChild(el);
    });

    sidebar.appendChild(group);
  });

  // ── Globe ──────────────────────────────────────────────────────────────────
  const wrap = document.getElementById('globe-container');
  let activeId = null;

  const globe = Globe()(wrap)
    .width(wrap.clientWidth)
    .height(wrap.clientHeight)
    .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg')
    .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
    .atmosphereColor('#4a7fa5')
    .atmosphereAltitude(0.15)
    .pointsData(NOTES)
    .pointLat('lat')
    .pointLng('lng')
    .pointColor(d => d.id === activeId ? '#ffffff' : 'rgba(255,255,255,0.55)')
    .pointRadius(d => d.id === activeId ? 0.55 : 0.38)
    .pointAltitude(0.01)
    .pointLabel(d => `<div style="font-family:system-ui,sans-serif;font-size:12px;color:#fff;padding:3px 8px;background:rgba(0,0,0,0.65);border-radius:4px;white-space:nowrap;">${d.label}</div>`)
    .onPointClick(d => activate(d.id));

  // Start with a nice initial view
  globe.pointOfView({ lat: 20, lng: 80, altitude: 2.2 }, 0);

  // Auto-rotate
  const controls = globe.controls();
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.35;
  controls.enableZoom = false;

  // Pause rotation on user drag
  controls.addEventListener('start', () => { controls.autoRotate = false; });

  // ── Resize ────────────────────────────────────────────────────────────────
  new ResizeObserver(() => {
    globe.width(wrap.clientWidth).height(wrap.clientHeight);
  }).observe(wrap);

  // ── Activate ──────────────────────────────────────────────────────────────
  function activate(id) {
    activeId = id;

    // Update sidebar highlight
    document.querySelectorAll('.timeline-entry').forEach(el => {
      el.classList.toggle('active', +el.dataset.id === id);
    });

    // Refresh point styling
    globe.pointColor(d => d.id === activeId ? '#ffffff' : 'rgba(255,255,255,0.55)')
         .pointRadius(d => d.id === activeId ? 0.55 : 0.38);

    // Fly globe to location
    const note = NOTES.find(n => n.id === id);
    controls.autoRotate = false;
    globe.pointOfView({ lat: note.lat, lng: note.lng, altitude: 1.8 }, 900);
  }
</script>

</body>
</html>
